name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pyflakes

      - name: flake8 — syntax and undefined names
        run: |
          flake8 phantom_track.py \
            --max-line-length=120 \
            --select=E9,F4,F63,F7,F82 \
            --show-source \
            --statistics

  import-check:
    name: Import check (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests phonenumbers

      - name: Verify all imports resolve
        run: python -c "import phantom_track"
        shell: bash

      - name: Check startup does not crash (syntax + top-level init)
        run: python -c "
import ast, sys
with open('phantom_track.py', 'r', encoding='utf-8') as f:
    src = f.read()
try:
    ast.parse(src)
    print('AST parse OK')
except SyntaxError as e:
    print(f'SyntaxError: {e}')
    sys.exit(1)
"
        shell: bash
